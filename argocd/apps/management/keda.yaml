# KEDA. Shared cluster add-on for event-driven autoscaling. KServe does not
# install it, but it uses it: for each LLMInferenceService with
# spec.scaling.keda, the KServe controller creates and manages a KEDA
# ScaledObject. Wave 0 in the management stack, before the kserve group
# (wave 1): the KServe controller watches ScaledObjects only if the KEDA CRDs
# exist when the controller starts.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keda
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  sources:
    - repoURL: https://kedacore.github.io/charts
      chart: keda
      targetRevision: 2.21.0
      helm:
        releaseName: keda
        valueFiles:
          - $values/helm/management/keda/values.yaml
    - repoURL: https://github.com/zessam/ai-inference-platform.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: keda
  # KEDA generates its own certificates and writes the CA bundle into its
  # webhook and into the APIService for external metrics after sync. Ignore
  # that field so Argo CD does not report drift or remove it.
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
    - group: apiregistration.k8s.io
      kind: APIService
      jqPathExpressions:
        - .spec.caBundle
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jqPathExpressions:
        - .spec.conversion.webhook.clientConfig.caBundle
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
