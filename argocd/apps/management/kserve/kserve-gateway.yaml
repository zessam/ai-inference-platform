# Local chart helm/management/kserve/kserve-gateway: EnvoyProxy, GatewayClass "envoy"
# and Gateway kserve/kserve-ingress-gateway, the gateway that
# LLMInferenceService uses by default.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kserve-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/zessam/ai-inference-platform.git
    targetRevision: main
    path: helm/management/kserve/kserve-gateway
    helm:
      releaseName: kserve-gateway
  destination:
    server: https://kubernetes.default.svc
    namespace: kserve
  # cert-manager (or the controller itself) writes the CA bundle into webhook
  # configurations and CRD conversion webhooks after sync. Ignore that field so
  # Argo CD does not report drift or remove it.
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jqPathExpressions:
        - .spec.conversion.webhook.clientConfig.caBundle
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
