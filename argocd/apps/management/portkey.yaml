# Portkey AI Gateway (open-source). One OpenAI-compatible API in front of the
# models. Local chart helm/management/portkey. Sync wave 1, after the kserve
# group (wave 0), because Portkey sends requests to the KServe gateway.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: portkey
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/zessam/ai-inference-platform.git
    targetRevision: main
    path: helm/management/portkey
    helm:
      releaseName: portkey
  destination:
    server: https://kubernetes.default.svc
    namespace: portkey
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
