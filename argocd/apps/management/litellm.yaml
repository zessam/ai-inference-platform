# Group Application "litellm". Syncs the Applications in
# argocd/apps/management/litellm: the CloudNativePG operator, the PostgreSQL
# database and the LiteLLM proxy. Sync wave 2, after the kserve group (wave 1), because
# LiteLLM sends requests to the KServe gateway.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: litellm-group
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/zessam/ai-inference-platform.git
    targetRevision: main
    path: argocd/apps/management/litellm
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
