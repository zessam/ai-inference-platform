# PostgreSQL database for LiteLLM (CNPG Cluster litellm/litellm-db).
# Local chart helm/management/litellm/litellm-db. CNPG creates the Secret
# litellm-db-app with the user, password and host.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: litellm-db
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/zessam/ai-inference-platform.git
    targetRevision: main
    path: helm/management/litellm/litellm-db
    helm:
      releaseName: litellm-db
  destination:
    server: https://kubernetes.default.svc
    namespace: litellm
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
