# kube-prometheus-stack: Prometheus Operator, Prometheus, Grafana,
# kube-state-metrics and node-exporter. KEDA reads the vLLM metrics from this
# Prometheus. Source 1 is the Helm chart. Source 2 is this repo, used only for
# the values file.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 93.1.2
      helm:
        releaseName: kube-prometheus-stack
        valueFiles:
          - $values/helm/monitoring/kube-prometheus-stack/values.yaml
    - repoURL: https://github.com/zessam/ai-inference-platform.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      # The CRDs of this chart are too large for client-side apply.
      - ServerSideApply=true
