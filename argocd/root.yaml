# Root Application (app-of-apps). Syncs the stack Applications in argocd/stacks.
# Apply once by hand: kubectl apply -f argocd/root.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/zessam/ai-inference-platform.git
    targetRevision: main
    path: argocd/stacks
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
