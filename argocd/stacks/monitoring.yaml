# Stack Application "monitoring". Syncs the Applications in argocd/apps/monitoring.
# Sync wave 0. The Application health check in patches/argocd-app-health.yaml
# makes the root app wait until this stack is Healthy before the next wave.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/zessam/ai-inference-platform.git
    targetRevision: main
    path: argocd/apps/monitoring
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
