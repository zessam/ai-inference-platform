apiVersion: v1
kind: Service
metadata:
  name: portkey-gateway
  labels:
    app.kubernetes.io/name: portkey-gateway
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: portkey-gateway
  ports:
    - name: http
      port: 8787
      targetPort: http
      nodePort: {{ .Values.nodePort }}
