apiVersion: apps/v1
kind: Deployment
metadata:
  name: portkey-gateway
  labels:
    app.kubernetes.io/name: portkey-gateway
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: portkey-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: portkey-gateway
    spec:
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - name: http
              containerPort: 8787
          # GET / returns "AI Gateway says hey!".
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
