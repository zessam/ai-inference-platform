# Values for the Envoy Gateway Helm chart v1.8.6
# (argocd/apps/management/kserve/envoy-gateway.yaml).
# The config block combines the two files that Envoy AI Gateway v1.1.0 requires:
#   manifests/envoy-gateway-values.yaml
#   examples/inference-pool/envoy-gateway-values-addon.yaml

deployment:
  pod:
    nodeSelector:
      pool: management

certgen:
  job:
    nodeSelector:
      pool: management

config:
  envoyGateway:
    gateway:
      controllerName: gateway.envoyproxy.io/gatewayclass-controller
    logging:
      level:
        default: info
    provider:
      type: Kubernetes
    extensionApis:
      enableEnvoyPatchPolicy: true
      enableBackend: true
    # Envoy AI Gateway changes the xDS configuration that Envoy Gateway generates.
    extensionManager:
      hooks:
        xdsTranslator:
          translation:
            listener:
              includeAll: true
            route:
              includeAll: true
            cluster:
              includeAll: true
            secret:
              includeAll: true
          post:
            - Translation
            - Cluster
            - Route
      service:
        fqdn:
          hostname: ai-gateway-controller.envoy-ai-gateway-system.svc.cluster.local
          port: 1063
      # Lets an HTTPRoute send traffic to an InferencePool (llm-d routing).
      backendResources:
        - group: inference.networking.k8s.io
          kind: InferencePool
          version: v1
