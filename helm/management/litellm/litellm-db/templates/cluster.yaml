# CNPG creates the PostgreSQL pod, its volume, the Service <name>-rw and the
# Secret <name>-app (keys: username, password, host, port, dbname, uri).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.name }}
spec:
  instances: {{ .Values.instances }}
  imageName: {{ .Values.imageName }}
  bootstrap:
    initdb:
      database: {{ .Values.database }}
      owner: {{ .Values.owner }}
  storage:
    size: {{ .Values.storageSize }}
  affinity:
    nodeSelector:
      {{- toYaml .Values.nodeSelector | nindent 6 }}
  resources:
    {{- toYaml .Values.resources | nindent 4 }}
