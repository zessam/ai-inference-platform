# The container named "main" is merged with the preset kserve-config-llm-template.
# The preset supplies the vllm serve command, the ports and the probes. These
# fields replace the GPU image and settings of the preset with CPU ones.
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: {{ .Values.name }}
spec:
  model:
    uri: {{ .Values.model.uri }}
    name: {{ .Values.model.name }}
{{- if .Values.autoscaling.enabled }}
  scaling:
    minReplicas: {{ .Values.autoscaling.minReplicas }}
    maxReplicas: {{ .Values.autoscaling.maxReplicas }}
    keda:
      pollingInterval: {{ .Values.autoscaling.pollingInterval }}
      triggers:
        - type: prometheus
          metadata:
            serverAddress: {{ .Values.autoscaling.prometheusAddress }}
            query: 'sum({{ .Values.autoscaling.metric }}{namespace="{{ .Release.Namespace }}",model_name="{{ .Values.model.name }}"})'
            threshold: {{ .Values.autoscaling.threshold | quote }}
      # No keda.advanced.horizontalPodAutoscalerConfig: in KServe v0.21.0 the CRD
      # rule for it reads .name without has(), so any horizontalPodAutoscalerConfig
      # without a name fails validation ("no such key: name"). The HPA default
      # scale-down stabilization window (300 seconds) applies instead.
{{- else }}
  replicas: {{ .Values.replicas }}
{{- end }}
  router:
    # Defaults: llm-d scheduler, HTTPRoute on kserve/kserve-ingress-gateway.
    scheduler: {}
    route: {}
    gateway: {}
  template:
    serviceAccountName: {{ .Values.serviceAccount.name }}
    nodeSelector:
      {{- toYaml .Values.nodeSelector | nindent 6 }}
    tolerations:
      {{- toYaml .Values.tolerations | nindent 6 }}
    {{- if .Values.antiAffinity }}
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: {{ .Values.name }}
                app.kubernetes.io/component: llminferenceservice-workload
    {{- end }}
    containers:
      - name: main
        image: {{ .Values.image }}
        # The vLLM CPU image runs as root.
        securityContext:
          runAsNonRoot: false
        env:
          - name: VLLM_CPU_KVCACHE_SPACE
            value: {{ .Values.kvCacheSpaceGiB | quote }}
          {{- if .Values.maxNumSeqs }}
          # Read by the vllm serve command of the KServe preset.
          - name: VLLM_ADDITIONAL_ARGS
            value: "--max-num-seqs {{ .Values.maxNumSeqs }}"
          {{- end }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        # vLLM on CPU starts slowly. Values from the KServe CPU sample.
        livenessProbe:
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 30
          failureThreshold: 5
