# Values for the local vllm chart (argocd/apps/inference/vllm.yaml).
# One LLMInferenceService (KServe v0.21.0, serving.kserve.io/v1alpha2).

# Name of the LLMInferenceService. The gateway serves the model at
# /<namespace>/<name>/v1/... on kserve-ingress-gateway.
name: smollm2

model:
  # Downloaded by the KServe storage-initializer from SeaweedFS.
  uri: s3://models/smollm2-135m-instruct
  # Value of --served-model-name. Clients send it in the "model" field.
  name: smollm2-135m-instruct

# Fixed number of replicas. Used only when autoscaling.enabled is false.
# The CRD rejects spec.replicas and spec.scaling together.
replicas: 1

# Autoscaling with KEDA. KServe turns this into a KEDA ScaledObject. KEDA runs
# the Prometheus query every pollingInterval seconds and drives an HPA:
# replicas = ceil(query result / threshold), between minReplicas and maxReplicas.
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  # The vLLM metric that decides the scale. vllm:num_requests_waiting counts
  # the requests in the queue of each pod (requests that vLLM can not start
  # yet). The query sums it over all pods of this model.
  metric: vllm:num_requests_waiting
  # Target per replica: one replica for each 2 waiting requests.
  threshold: "2"
  pollingInterval: 15
  # Scale-down: the HPA default stabilization window applies. A scaled-up
  # replica stays for 300 seconds after the queue is empty. It can not be set
  # here, because of a CRD validation bug in KServe v0.21.0 (see the template).
  prometheusAddress: http://kube-prometheus-stack-prometheus.monitoring.svc:9090

# Lab only: vLLM runs at most this many requests at the same time, so that a
# few parallel requests fill the queue and trigger the scaling. Remove it on
# GPU nodes (vLLM then uses its default).
maxNumSeqs: 4

# Required pod anti-affinity on kubernetes.io/hostname: each replica runs on a
# different inference node (worker2, worker3).
antiAffinity: true

# vLLM CPU build, pinned by tag and digest. This is the CPU image that the
# KServe v0.21.0 presets use. Replace it with a GPU image for GPU nodes.
image: docker.io/vllm/vllm-openai-cpu:v0.23.0@sha256:89e1fbe829038b1a560601990c8ec89625c622a969fcbc8f10ce48b6139795be

# GiB of memory for the vLLM KV cache on CPU.
kvCacheSpaceGiB: "1"

resources:
  requests:
    cpu: "1"
    memory: 4Gi
  limits:
    cpu: "2"
    memory: 8Gi

nodeSelector:
  pool: inference

tolerations:
  - key: workload
    operator: Equal
    value: inference
    effect: NoSchedule

# ServiceAccount for the model download. It lists the Secret s3-models, which
# scripts/argocd-deployment.sh creates outside Git with the SeaweedFS read keys.
serviceAccount:
  name: kserve-s3
  s3Secret: s3-models

# PodMonitor for the vLLM metrics (templates/podmonitor.yaml).
metrics:
  enabled: true
  interval: 15s
