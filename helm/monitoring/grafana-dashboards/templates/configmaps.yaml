{{- range $dir, $folder := .Values.folders }}
{{- range $path, $_ := $.Files.Glob (printf "dashboards/%s/*.json" $dir) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-{{ $dir }}-{{ base $path | trimSuffix ".json" }}
  labels:
    grafana_dashboard: "1"
  annotations:
    # Grafana folder (kube-prometheus-stack grafana.sidecar.dashboards.folderAnnotation).
    grafana_folder: {{ $folder | quote }}
data:
  {{ base $path }}: |-
{{ $.Files.Get $path | indent 4 }}
{{- end }}
{{- end }}
