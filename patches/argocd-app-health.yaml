# Merge patch for ConfigMap argocd-cm. Adds a health check for Application
# resources, so a parent app (root) waits for each stack to be Healthy before
# the next sync wave. Status is Progressing until the child reports health.
data:
  resource.customizations.health.argoproj.io_Application: |
    hs = {}
    hs.status = "Progressing"
    hs.message = ""
    if obj.status ~= nil and obj.status.health ~= nil then
      hs.status = obj.status.health.status
      if obj.status.health.message ~= nil then
        hs.message = obj.status.health.message
      end
    end
    return hs
